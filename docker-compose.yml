services:
  api:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD","/go-prod-stack", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "8000:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
       api:
          condition: service_healthy
    restart: unless-stopped
  